# ===================== User interface (used by app.py) =====================
# Every text shown in the web interface lives here, in Spanish and English, so it can be edited without touching the code.
ui:
  page_icon: "🪐"
  default_language: es                 # "es" or "en"
  feedback_form_url: "https://forms.gle/nXGF7k8nkozAdY757"                
  show_technical_details: false        # true = show outcome, similarity and response time under each answer

  es:
    language_name: "Español"
    title: "Orbit: tu guía del Sistema Solar y las misiones espaciales"
    tagline: "Pregúntame sobre planetas, lunas, asteroides y misiones como Apolo, Artemis o Voyager."
    welcome: "¡Hola! Soy **Orbit**. Puedo responder preguntas sobre el Sistema Solar y las misiones espaciales usando páginas de NASA y Wikipedia, y te muestro las fuentes. Prueba con uno de los ejemplos de la barra lateral o escribe tu pregunta."
    disclaimer: "⚠️ Orbit es un prototipo académico que usa un modelo de lenguaje pequeño: puede cometer errores o inventar datos. Verifica la información importante en las fuentes que aparecen debajo de cada respuesta."
    input_placeholder: "Escribe tu pregunta sobre el espacio…"
    thinking: "Orbit está buscando en su base de conocimiento… en un equipo sin GPU puede tardar hasta un minuto."
    error: "Ocurrió un error inesperado al generar la respuesta. Intenta de nuevo o reformula la pregunta."
    new_chat: "🗑️ Nueva conversación"
    about_header: "Acerca de Orbit"
    capabilities_header: "✅ Qué puede hacer"
    capabilities:
      - "Responder preguntas sobre el Sistema Solar y cerca de 50 misiones espaciales (Apolo, Artemis, Voyager, rovers de Marte, Hubble, Webb y más)."
      - "Mostrar las fuentes de cada respuesta."
      - "Recordar las últimas preguntas de la conversación para entender seguimientos como «¿y cuál es el más grande?»."
      - "Explicar como a un niño («explícamelo como si tuviera 10 años»), comparar cuerpos o misiones («compara Marte y Venus») y hacer un mini quiz («hazme un quiz sobre…»)."
      - "Responder en español o inglés, según el idioma de tu pregunta."
    limitations_header: "⛔ Qué NO puede hacer"
    limitations:
      - "No da datos en tiempo real (por ejemplo, dónde está una nave ahora mismo)."
      - "Solo conoce las páginas de NASA y Wikipedia que se cargaron; algunas misiones y temas no están incluidos."
      - "Al ser un modelo pequeño, puede equivocarse aunque cite fuentes; el quiz puede salir sin respuestas o con preguntas poco precisas."
      - "Cuando no encuentra información fiable, lo dice en lugar de inventar."
      - "En equipos sin GPU puede tardar entre 30 y 60 segundos en responder."
    privacy_header: "🔒 Privacidad"
    privacy: "No se piden datos personales. Las conversaciones se guardan de forma anónima (con un identificador aleatorio) para mejorar el sistema; los correos y teléfonos se enmascaran."
    examples_header: "💡 Prueba con estas preguntas"
    examples:
      - "¿Cuántos planetas hay en el sistema solar?"
      - "¿Cuándo se lanzó Voyager 1?"
      - "¿Qué descubrió el rover Curiosity en Marte?"
      - "¿Qué es el telescopio espacial James Webb?"
      - "¿Cómo se formó el sistema solar?"
    feedback_header: "💬 Tu opinión"
    feedback_help: "Usa 👍 / 👎 debajo de cada respuesta: tu voto se guarda de forma anónima y nos ayuda a mejorar."
    feedback_thanks: "¡Gracias por tu opinión!"
    feedback_button: "Responder el formulario de opinión"
    technical_toggle: "Mostrar detalles técnicos"

  en:
    language_name: "English"
    title: "Orbit: your guide to the Solar System and space missions"
    tagline: "Ask me about planets, moons, asteroids and missions such as Apollo, Artemis or Voyager."
    welcome: "Hi! I'm **Orbit**. I can answer questions about the Solar System and space missions using NASA and Wikipedia pages, and I show my sources. Try one of the examples in the sidebar or type your question."
    disclaimer: "⚠️ Orbit is an academic prototype that uses a small language model: it can make mistakes or invent facts. Check important information in the sources shown below each answer."
    input_placeholder: "Type your question about space…"
    thinking: "Orbit is searching its knowledge base… on a machine without a GPU this can take up to a minute."
    error: "An unexpected error occurred while generating the answer. Please try again or rephrase your question."
    new_chat: "🗑️ New conversation"
    about_header: "About Orbit"
    capabilities_header: "✅ What it can do"
    capabilities:
      - "Answer questions about the Solar System and about 50 space missions (Apollo, Artemis, Voyager, Mars rovers, Hubble, Webb and more)."
      - "Show the sources of every answer."
      - "Remember the latest questions of the conversation to understand follow-ups such as “and which one is the biggest?”."
      - "Explain like you are a child (“explain it like I'm 10”), compare bodies or missions (“compare Mars and Venus”) and run a mini quiz (“quiz me about…”)."
      - "Answer in Spanish or English, matching the language of your question."
    limitations_header: "⛔ What it can NOT do"
    limitations:
      - "It does not provide real-time data (for example, where a spacecraft is right now)."
      - "It only knows the NASA and Wikipedia pages that were loaded; some missions and topics are not included."
      - "Being a small model, it can be wrong even when it cites sources; the quiz may come without answers or with imprecise questions."
      - "When it cannot find reliable information, it says so instead of inventing an answer."
      - "On machines without a GPU it can take 30 to 60 seconds to answer."
    privacy_header: "🔒 Privacy"
    privacy: "No personal data is requested. Conversations are stored anonymously (with a random identifier) to improve the system; e-mails and phone numbers are masked."
    examples_header: "💡 Try these questions"
    examples:
      - "How many planets are in the Solar System?"
      - "When was Voyager 1 launched?"
      - "What did the Curiosity rover discover on Mars?"
      - "What is the James Webb Space Telescope?"
      - "How did the Solar System form?"
    feedback_header: "💬 Your opinion"
    feedback_help: "Use 👍 / 👎 below each answer: your vote is stored anonymously and helps us improve."
    feedback_thanks: "Thanks for your feedback!"
    feedback_button: "Fill in the feedback form"
    technical_toggle: "Show technical details"
