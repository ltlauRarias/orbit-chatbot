# ===================== Orbit configuration =====================
paths:
  raw_dir: data/raw                  # downloaded and cleaned source documents
  chroma_dir: data/chroma            # persistent vector store
  logs_dir: logs                     # anonymous JSONL logs
  profile_file: data/profiles.json   # lightweight user preferences (no personal data)

http:
  # Wikipedia asks for an identifiable User-Agent.
  user_agent: "OrbitChatbot/1.0 (university course project)"

models:
  llm_name: Qwen/Qwen2.5-1.5B-Instruct
  embedding_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  device: auto               # "auto" = GPU if usable, otherwise CPU. Use "cpu" to force CPU
  llm_dtype: auto            # "auto" = float16 on GPU, float32 on CPU. Other options: float16, bfloat16, float32

generation:
  max_new_tokens: 350        # upper bound of the answer length (in tokens)
  temperature: 0.2           # low = more deterministic, fewer inventions
  top_p: 0.9                 # nucleus sampling
  repetition_penalty: 1.05   # discourages loops that small models sometimes fall into
  max_answer_chars: 1800     # post-processing limit (not applied to quizzes)

retrieval:
  collection_name: orbit_kb
  top_k: 4                   # number of chunks retrieved per question
  min_similarity: 0.40       # cosine similarity threshold (calibrate later)
  max_context_chars: 3500    # budget for the retrieved context inside the prompt

chunking:
  chunk_size_tokens: 110     # must be < embedding model max_seq_length
  chunk_overlap_tokens: 20   # overlap so ideas are not cut at chunk borders
  min_chunk_tokens: 12       # tiny fragments are discarded

memory:
  max_turns: 4               # short-term memory window (user/assistant exchanges)
  max_history_chars: 1500    # character budget for the history inside the prompt
  rewrite_followups: true    # rewrite short follow-ups as standalone queries

personalization:
  enabled: true              # remember simple preferences (e.g. likes simple explanations)

input:
  max_input_chars: 600       # longer inputs are truncated

sources:
  # ---------- Core sources (hand-curated) ----------
  - id: nasa_facts
    title: "Solar System: Facts"
    publisher: NASA Science
    type: web
    url: https://science.nasa.gov/solar-system/solar-system-facts/
    license: "NASA content: generally public domain"
  - id: nasa_exploration
    title: "Solar System Exploration"
    publisher: NASA Science
    type: web
    url: https://science.nasa.gov/solar-system/
    license: "NASA content: generally public domain"
  - id: wikipedia_es_sistema_solar
    title: "Sistema solar"
    publisher: Wikipedia
    type: wikipedia
    lang: es
    page: Sistema_solar
    url: https://es.wikipedia.org/wiki/Sistema_solar
    license: "CC BY-SA 4.0"
  - id: nasa_sun
    title: "The Sun"
    publisher: NASA Science
    type: web
    url: https://science.nasa.gov/sun/
    license: "NASA content: generally public domain"
  - id: nasa_exploration_overview
    title: "Exploration"                    
    publisher: NASA Science
    type: web
    url: https://science.nasa.gov/solar-system/exploration/
    license: "NASA content: generally public domain"
  - id: nasa_planetary_missions
    title: "Planetary Missions"               
    publisher: NASA
    type: web
    url: https://www.nasa.gov/planetarymissions/
    license: "NASA content: generally public domain"
  - id: nasa_sep_program
    title: "Solar System Exploration Program" 
    publisher: NASA
    type: web
    url: https://www.nasa.gov/planetarymissions/solar-system-exploration-program/
    license: "NASA content: generally public domain"
  - id: nssdc_chronology
    title: "Chronology of Lunar and Planetary Exploration"  
    publisher: NASA NSSDC
    type: web
    parser: nssdc_timeline
    url: https://nssdc.gsfc.nasa.gov/planetary/chronology.html
    license: "NASA content: generally public domain"

